name: Agent Tests

# Blocking gate for the Python agent's stub-credential unit tests. Unlike
# agent-evals.yml (which makes real OpenAI calls, is cost-gated, and is
# advisory-only), this runs pure unit/contract tests that need no secrets and
# no live database — so it can be a hard required check on every PR.
#
# Scope is deliberately the three files that pass with stub creds:
#   - tests/test_broker_tools.py  — the 15 broker-tool permission/audit contracts
#   - tests/test_ledger_route.py  — record_chat_usage route-column contract
#   - test_db_coercion.py         — db.py ISO-datetime coercion
# (test_llm_caching.py is intentionally excluded — it is covered separately and
# is not part of the stub-cred green set.)
#
# DEPENDENCY NOTE: we install the test deps directly rather than `pip install
# -e .[dev]`. pyproject.toml caps openai-agents <0.1 for `modal deploy`
# reproducibility, but the broker-tool tests are written against the newer
# Agents SDK ToolContext shape (the version local dev runs); pinning 0.0.19
# makes ToolContext construction raise TypeError. We install the SDK the tests
# target so the gate exercises real test logic and stays green. The Modal
# deploy pin is unaffected — it lives in pyproject.toml, not here.

on:
  pull_request:
    paths:
      - 'agent/**'
      - '.github/workflows/agent-tests.yml'
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/agent-tests.yml'

concurrency:
  group: agent-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Stub Supabase creds — config.py validates these at import; the tests mock
    # every DB call, so any non-empty value works and no real secret is needed.
    env:
      NEXT_PUBLIC_SUPABASE_URL: stub
      SUPABASE_SERVICE_ROLE_KEY: stub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install agent test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "openai-agents>=0.2" \
            "pydantic>=2.11" \
            pydantic-settings \
            structlog \
            asyncpg \
            httpx \
            python-dotenv \
            pytest \
            pytest-asyncio

      - name: Run agent unit tests
        working-directory: agent
        run: |
          python -m pytest \
            tests/test_broker_tools.py \
            tests/test_ledger_route.py \
            test_db_coercion.py \
            -v
