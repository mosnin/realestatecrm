# Browser e2e suite (Playwright, real Chromium) — see e2e-browser/README.md.
#
# NOTE: this job is deliberately SOFT-FAIL (continue-on-error: true) while the
# suite proves itself stable on real PRs. Once it has run green for ~10
# consecutive PR runs with no infra-cause flakes, a human should flip
# continue-on-error to false and mark the job required in branch protection
# so regressions on the public surface block merges. Do not flip this
# automatically — a bot/agent should not be the one deciding the burn-in
# period is over.
name: e2e-browser

on:
  pull_request:

concurrency:
  group: e2e-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true # soft-fail during burn-in — flip to false after ~10 green runs (see NOTE above)
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Downloads ARE allowed in CI (unlike the sandboxed dev container, which
      # ships a pre-installed Chromium under PLAYWRIGHT_BROWSERS_PATH).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The app env comes from e2e-browser/.env.e2e via playwright.config.ts —
      # all stub values, no secrets needed here.
      - name: Run browser e2e suite
        run: pnpm test:e2e:browser

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e-browser/playwright-report
            e2e-browser/test-results
          retention-days: 14
