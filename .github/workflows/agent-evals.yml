name: Agent Evals

# TS is the primary chat runtime. These evals use the real OpenRouter model
# with fixture CRM data; they do not prove live mail/calendar delivery.
# Enable AGENT_EVALS_ENABLED for nightly/PR model runs. Missing credentials
# on an enabled run fail explicitly; a skipped run is not release evidence.

on:
  schedule:
    # 02:30 UTC daily. After most US contributors are done pushing for
    # the day so a flaky nightly doesn't burn the next morning.
    - cron: '30 2 * * *'
  pull_request:
    # Only run on PRs that touch prompt-assembly or tool-definition code
    # so cost stays bounded. Non-prompt PRs don't trigger the eval.
    paths:
      - 'agent/chippi.py'
      - 'agent/orchestrator.py'
      - 'agent/tools/**'
      - 'lib/ai.ts'
      - 'lib/ai-tools/system-prompt.ts'
      - 'lib/ai-tools/tools/**'
      - 'lib/ai-tools/sdk-chat.ts'
      - 'lib/ai-tools/sdk-bridge.ts'
      - 'lib/chat/**'
      - 'lib/agent/**'
      - 'lib/workflows/**'
      - 'tests/evals/**'
      - '.github/workflows/agent-evals.yml'
  workflow_dispatch:
    # Manual trigger for ad-hoc runs (e.g. after a prompt change).
    inputs:
      ref:
        description: 'Branch or SHA to eval'
        required: false
        default: 'main'

concurrency:
  group: agent-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.AGENT_EVALS_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run agent evals
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RUN_EVALS: '1'
        run: |
          test -n "$OPENROUTER_API_KEY" || { echo "::error::OPENROUTER_API_KEY is required for enabled agent evals"; exit 1; }
          set -o pipefail
          pnpm eval 2>&1 | tee eval-output.log

      - name: Upload eval log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-log
          path: eval-output.log
          if-no-files-found: ignore
          retention-days: 14
