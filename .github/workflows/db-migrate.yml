name: DB Migrate (production)

# Applies pending Supabase migrations from supabase/migrations/ to the
# PRODUCTION database via the Supabase CLI.
#
# Safety model (migrations NEVER auto-apply silently):
#   1. Manual trigger only — workflow_dispatch. Nothing here runs on push/PR.
#   2. The `apply` job targets the `production-db` GitHub Environment. Configure
#      that environment with REQUIRED REVIEWERS so every prod run pauses for a
#      human to approve before any SQL touches prod. (See docs/RELEASE.md.)
#   3. A diff/dry-run job runs first and prints the pending changes. The apply
#      job has `needs: diff`, so you see what will change before approving.
#   4. `confirm: APPLY` input must be typed to proceed — guards against an
#      accidental "Run workflow" click.
#
# Secrets / vars required (set under Settings, see docs/RELEASE.md):
#   secret  SUPABASE_ACCESS_TOKEN   — personal access token for the CLI
#   secret  SUPABASE_DB_PASSWORD    — production DB password (for `db push`)
#   var     SUPABASE_PROJECT_REF    — production project ref (e.g. abcdefgh...)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to confirm you intend to migrate PRODUCTION.'
        required: true
        default: ''

concurrency:
  # Never let two migration runs race against the same prod database.
  group: db-migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1) DRY RUN — show what WOULD change. No approval gate, no writes.
  #    `supabase db push --dry-run` lists the migrations that are pending on the
  #    linked prod DB without applying them.
  # ---------------------------------------------------------------------------
  diff:
    name: Diff (dry-run, no writes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Reject run unless confirm == APPLY
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "APPLY" ]; then
            echo "::error::You must type APPLY in the confirm box to run this workflow."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to production project
        run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"

      - name: Show pending migrations (dry-run)
        run: |
          echo "Migrations the CLI considers PENDING on production:"
          supabase migration list --linked
          echo "----------------------------------------------------------------"
          echo "SQL that WOULD be applied (no changes are made in this step):"
          supabase db push --linked --dry-run

  # ---------------------------------------------------------------------------
  # 2) APPLY — gated by the `production-db` Environment (required reviewers).
  #    Runs only after `diff` succeeds and a human approves the deployment.
  # ---------------------------------------------------------------------------
  apply:
    name: Apply migrations to production
    needs: diff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-db
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to production project
        run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"

      - name: Apply pending migrations
        # `db push` applies every migration in supabase/migrations/ that is not
        # yet recorded in the remote supabase_migrations.schema_migrations table,
        # in filename order. Already-applied migrations are skipped, so a re-run
        # is safe. Migrations are written IF NOT EXISTS / idempotent per
        # docs/DATABASE.md, which is a second layer of replay safety.
        run: supabase db push --linked

      - name: Confirm state after apply
        run: |
          echo "Migration state on production after push:"
          supabase migration list --linked
